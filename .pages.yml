media:
  input: images
  output: images
  categories: [image]

content:
  - name: site
    label: 포트폴리오
    type: file
    path: content/site.json
    format: json
    fields:
      - name: site
        label: 사이트 설정
        type: object
        fields:
          - name: name
            label: 작가 이름
            type: string
          - name: nameEn
            label: 영문 이름
            type: string
          - name: email
            label: 이메일
            type: string
          - name: instagram
            label: 인스타그램 (@아이디)
            type: string
          - name: bg
            label: 바탕화면 배경색 (예 #c9ccc3)
            type: string
            description: "채도가 낮은 단색을 권해요. 예시 — 이끼 회색 #c9ccc3, 한지 #e4e1da, 새벽 #d6d9de, 흐린 하늘 #b9c4cf, 황토 #d8c9b8, 쑥 #9aa594, 먹 #2f3133, 밤 #1f2a3a"

      - name: works
        label: 작업
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({year})"
        fields:
          - name: title
            label: 제목
            type: string
          - name: year
            label: 연도
            type: string
          - name: medium
            label: 재료 / 기법
            type: string
          - name: size
            label: 크기
            type: string
            description: "예) 130.3 × 97 cm (60호)"
          - name: desc
            label: 작품 설명
            type: text
            description: 빈 줄로 문단을 나눌 수 있어요.
          - name: icon
            label: 바탕화면 아이콘 (누끼 PNG)
            type: image
            description: 배경을 지운 투명 PNG를 올려 주세요.
          - name: images
            label: 작품 사진
            type: image
            options:
              multiple:
                max: 20
          - name: scale
            label: 아이콘 크기
            type: select
            options:
              values:
                - value: "0.8"
                  label: 작게
                - value: "1"
                  label: 보통
                - value: "1.25"
                  label: 크게
                - value: "1.5"
                  label: 아주 크게
          - name: x
            label: 가로 위치 (0 왼쪽 ~ 1 오른쪽)
            type: number
            description: 비워 두면 무작위 위치에 놓여요.
          - name: y
            label: 세로 위치 (0 위 ~ 1 아래)
            type: number
          - name: id
            label: 고유 이름 (영문, 바꾸지 않아도 돼요)
            type: string
          - name: sample
            label: 예시 표시
            type: boolean

      - name: cv
        label: 작가 이력
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{cat}"
        fields:
          - name: cat
            label: 분류 (학력, 개인전, 단체전 등)
            type: string
          - name: items
            label: 항목
            type: object
            list: true
            fields:
              - name: year
                label: 연도
                type: string
              - name: text
                label: 내용
                type: string

      - name: statement
        label: 스테이트먼트
        type: object
        fields:
          - name: ko
            label: 한국어
            type: text
          - name: en
            label: English
            type: text
