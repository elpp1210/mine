<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JIWON BYUN</title>
<meta name="description" content="변지원 작가 포트폴리오">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: a single fixed "desktop" in one solid colour; works float on it as cut-out icons, everything else opens as a window above it. */
:root{
  --desk:#c9ccc3;
  --ink:#1e201c;
  --ink-soft:#5b5f56;
  --paper:#fbfbf9;
  --paper-2:#efefeb;
  --line:#d9dad4;
  --accent:#2f5bd3;
  --danger:#c2412d;
  --ok:#2c7a4b;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-read:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --label:#1e201c;
  --label-shadow:rgba(255,255,255,.55);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* menu bar */
.menubar{position:fixed;inset:0 0 auto;z-index:500;display:flex;align-items:center;gap:4px;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--paper) 72%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent);font-size:13px}
.menubar .row{display:flex;align-items:center;gap:2px;height:30px;min-width:0;flex:1}
.mb-btn{border:0;background:none;padding:3px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
.mb-btn:hover,.mb-btn[aria-expanded="true"]{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.mb-name{font-weight:600}
.mb-spacer{flex:1}
.mb-clock{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;padding:0 6px;white-space:nowrap}
.gear{position:fixed;z-index:450;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:10px;border:0;padding:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(#9a9ca1,#6d7075);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 12px rgba(0,0,0,.22);opacity:.55;transition:opacity .2s,transform .2s}
.gear:hover,.gear:focus-visible{opacity:1;transform:rotate(30deg)}
.gear svg{width:26px;height:26px}
.gear.dirty{opacity:1}
.gear.dirty::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--desk)}

/* desktop */
.desk{position:fixed;inset:0;overflow:hidden;touch-action:none}
.icon{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:6px;cursor:grab;
  border-radius:10px;user-select:none;-webkit-user-select:none;touch-action:none;will-change:transform}
.icon:active{cursor:grabbing}
.icon .pic{display:grid;place-items:center;width:var(--s);height:var(--s);border-radius:8px;transition:transform .18s ease}
.icon img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.18)) drop-shadow(0 2px 3px rgba(0,0,0,.14))}
.icon:hover .pic{transform:translateY(-3px) scale(1.03)}
.icon.dragging .pic{transform:scale(1.07)}
.icon.dragging img{filter:drop-shadow(0 22px 22px rgba(0,0,0,.22)) drop-shadow(0 3px 4px rgba(0,0,0,.14))}
.icon .lab{max-width:calc(var(--s) + 24px);font-size:12px;line-height:1.3;text-align:center;color:var(--label);padding:1px 6px;border-radius:4px;
  text-shadow:0 1px 2px var(--label-shadow);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icon.sel .pic{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.icon.sel .lab{background:var(--accent);color:#fff;text-shadow:none}
.desk-hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--label);opacity:.6;pointer-events:none}
.desk-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--label);opacity:.7;font-size:14px;text-align:center;padding:0 24px}

/* windows */
.win{position:absolute;z-index:100;display:flex;flex-direction:column;background:var(--paper);border-radius:11px;
  box-shadow:0 0 0 1px rgba(0,0,0,.12),0 24px 60px -12px rgba(0,0,0,.35),0 8px 18px -8px rgba(0,0,0,.2);max-width:calc(100vw - 16px);overflow:hidden;
  animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
.win-bar{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:var(--paper-2);border-bottom:1px solid var(--line);cursor:grab;flex:none;touch-action:none;user-select:none}
.win-bar:active{cursor:grabbing}
.lights{display:flex;gap:7px}
.light{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:#c9c9c4;cursor:pointer}
.win.front .light.close{background:#ec6a5e}
.win.front .light.min{background:#f4bf4f}
.win.front .light.max{background:#61c554}
.light:focus-visible{outline-offset:1px}
.win-title{flex:1;text-align:center;font-size:12.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:57px}
.win.front .win-title{color:var(--ink)}
.win-body{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain}

/* work viewer */
.work{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);min-height:100%}
.work-stage{background:var(--paper-2);display:flex;flex-direction:column;gap:10px;padding:18px;min-width:0}
.work-main{flex:1;display:grid;place-items:center;min-height:260px}
.work-main img{max-height:min(62vh,560px);object-fit:contain}
.work-main img.cut{filter:drop-shadow(0 16px 20px rgba(0,0,0,.18))}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{flex:none;width:58px;height:58px;border-radius:6px;border:1px solid var(--line);background:var(--paper) center/contain no-repeat;cursor:pointer;padding:0}
.thumb[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.work-info{padding:24px 24px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.work-info h2{font-family:var(--f-read);font-size:24px;font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.meta dt{color:var(--ink-soft)}
.meta dd{margin:0;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.meta dd.txt{font-family:var(--f-ui);font-size:13px}
.prose{font-family:var(--f-read);font-size:15px;line-height:1.85;max-width:62ch}
.prose p{margin:0 0 1em}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:500;vertical-align:3px;margin-left:6px}

/* cv */
.doc{padding:30px 34px 40px;display:flex;flex-direction:column;gap:28px}
.doc-head h2{font-family:var(--f-read);font-size:26px;margin:0}
.doc-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13px}
.cv-sec h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cv-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:5px 0;font-size:14px;line-height:1.55}
.cv-row .y{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-soft);padding-top:1px}
.seg{display:inline-flex;background:var(--paper-2);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* list window */
.list{width:100%;border-collapse:collapse;font-size:13px}
.list th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:11.5px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
.list td{padding:7px 12px;border-bottom:1px solid var(--paper-2)}
.list tr.rowbtn{cursor:pointer}
.list tr.rowbtn:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.list .mini{width:30px;height:30px;object-fit:contain;vertical-align:middle}
.list .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}

/* admin */
.adm{display:flex;flex-direction:column;height:100%;min-height:0}
.adm-tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.adm-tabs button{border:0;background:none;padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-soft);white-space:nowrap}
.adm-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.adm-main{flex:1;overflow:auto;min-height:0}
.adm-foot{flex:none;display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);background:var(--paper-2);flex-wrap:wrap}
.adm-status{flex:1;font-size:12.5px;color:var(--ink-soft);min-width:160px}
.adm-status.err{color:var(--danger)}
.adm-status.good{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12px}
.iconbtn{border:0;background:none;width:26px;height:26px;border-radius:5px;cursor:pointer;color:var(--ink-soft);display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--paper-2);color:var(--ink)}
.notice{margin:14px 14px 0;padding:9px 12px;border-radius:8px;background:color-mix(in srgb,var(--accent) 9%,var(--paper));font-size:12.5px;line-height:1.5}

.wk{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
.wk-list{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wk-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.wk-item:hover{background:var(--paper-2)}
.wk-item[aria-current="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.wk-item img{width:32px;height:32px;object-fit:contain;flex:none}
.wk-item .t{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-item .t small{display:block;color:var(--ink-soft);font-family:var(--f-mono);font-size:11px}
.wk-form{padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:12px;color:var(--ink-soft);font-weight:500}
.field input[type=text],.field input[type=email],.field textarea,.field select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;font-size:13.5px;width:100%;box-sizing:border-box}
.field textarea{resize:vertical;line-height:1.6;min-height:110px}
.field textarea.long{min-height:260px;font-family:var(--f-read);font-size:14.5px}
.field .hint{font-size:11.5px;color:var(--ink-soft);line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:14px;background:repeating-conic-gradient(#f1f1ee 0 25%,#fff 0 50%) 0 0/14px 14px}
.drop.over{border-color:var(--accent)}
.drop img{width:88px;height:88px;object-fit:contain;flex:none}
.drop .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photo{position:relative;width:84px;height:84px;border-radius:8px;border:1px solid var(--line);background:var(--paper-2) center/cover no-repeat}
.photo .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px;line-height:1}
.photo .mv{position:absolute;bottom:3px;left:3px;display:flex;gap:2px}
.photo .mv button{width:20px;height:20px;border-radius:4px;border:0;background:rgba(255,255,255,.85);cursor:pointer;font-size:11px;padding:0}
.add-photo{width:84px;height:84px;border-radius:8px;border:1.5px dashed var(--line);background:none;cursor:pointer;color:var(--ink-soft);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pad{padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px}
.cvc{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cvc-head{display:flex;gap:8px;align-items:center}
.cvc-head input{flex:1;font-weight:600}
.cve{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:6px;align-items:center}
.cve input,.cvc-head input{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 8px;font-size:13px;min-width:0;width:100%;box-sizing:border-box}
.cve input.y{font-family:var(--f-mono);font-size:12.5px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.preview-desk{height:120px;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:28px}
.preview-desk img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:900;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (max-width:720px){
  .win{left:6px!important;top:calc(36px + env(safe-area-inset-top,0px))!important;width:calc(100vw - 12px)!important;height:calc(100% - 44px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))!important}
  .work{grid-template-columns:minmax(0,1fr)}
  .work-main{min-height:200px}
  .doc{padding:22px 18px 32px}
  .wk{grid-template-columns:minmax(0,1fr)}
  .wk-list{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto}
  .wk-item{width:auto;flex:none;max-width:170px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .mb-clock{display:none}
  .desk-hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .win{animation:none}
  .icon .pic{transition:none}
}
</style>
</head>

"use strict";
function imgSrc(ref){if(!ref)return "";ref=String(ref);if(/^(https?:|data:)/.test(ref))return ref;return ref.replace(/^\/+/,"")}

var DATA={site:{},works:[],cv:[],statement:{ko:"",en:""}};
function normalize(d){d=d||{};d.site=d.site||{};d.works=(d.works||[]).map(function(w,i){w=w||{};w.id=w.id||("w"+i);if(w.images&&!Array.isArray(w.images))w.images=[w.images];w.images=(w.images||[]).filter(Boolean);w.scale=+w.scale||1;if(w.x===""||w.x==null)w.x=null;else w.x=+w.x;if(w.y===""||w.y==null)w.y=null;else w.y=+w.y;return w});d.cv=(d.cv||[]).map(function(c){c.items=c.items||[];return c});d.statement=d.statement||{ko:"",en:""};return d}
var canEdit=false, dirty=false;

/* ---------- tiny DOM helper ---------- */

  if(props)for(var k in props){var v=props[k];if(v==null||v===false)continue;

    else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);else if(k==="value")el.value=v;else el.setAttribute(k,v===true?"":v)}

function paras(text){return String(text||"").split(/\n\s*\n/).filter(function(p){return p.trim()}).map(function(p){return h("p",{text:p.trim()})})}
function uid(){return "w"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(msg){var t=h("div",{class:"toast",role:"status",text:msg});document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}

/* ---------- colour ---------- */
function lum(hex){var m=/^#?([0-9a-f]{6})$/i.exec(hex||"");if(!m)return .6;var n=parseInt(m[1],16);
  var c=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}

var root=document.getElementById("root");
var desk=h("div",{class:"desk",id:"desk"});
var iconsLayer=h("div");
desk.appendChild(iconsLayer);
var hint=h("div",{class:"desk-hint",text:"작업을 끌어서 옮기거나 눌러서 열어 보세요"});
desk.appendChild(hint);
var nameBtn=h("button",{class:"mb-btn mb-name",onclick:function(){openInfo()}});
var clock=h("span",{class:"mb-clock","aria-hidden":"true"});
var menubar=h("nav",{class:"menubar","aria-label":"메뉴"},h("div",{class:"row"},
  nameBtn,
  h("button",{class:"mb-btn",onclick:function(){openList()}},"작업"),
  h("button",{class:"mb-btn",onclick:function(){openCV()}},"이력"),
  h("button",{class:"mb-btn",onclick:function(){openStatement()}},"스테이트먼트"),
  h("span",{class:"mb-spacer"}),clock));
root.appendChild(desk);root.appendChild(menubar);
function renderName(){nameBtn.textContent=DATA.site.name||"작가 이름"}
function tick(){var d=new Date();var days=["일","월","화","수","목","금","토"];
  clock.textContent=(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+days[d.getDay()]+") "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
tick();setInterval(tick,15000);

/* ---------- desktop icons ---------- */
var TOP=40, BASE=104;
var place={};   /* id -> {fx,fy} fractions of free area */
var nodes={};   /* id -> {el,x,y,w,h} */
var narrow=false, zTop=1, selected=null;
function deskSize(){return {W:desk.clientWidth,H:desk.clientHeight}}
function gridPlace(){
  var s=deskSize(),cols=Math.max(2,Math.floor((s.W-16)/118)),cellW=(s.W-16)/cols;
  DATA.works.forEach(function(w,i){var c=i%cols,r=Math.floor(i/cols);
    var px=8+c*cellW+(cellW-boxW(w))/2, py=TOP+12+r*148;
    place[w.id]=toFrac(w,px,py)})}
function boxW(w){return Math.round(BASE*(w.scale||1))+24}
function boxH(w){return Math.round(BASE*(w.scale||1))+48}
function toFrac(w,x,y){var s=deskSize();var aw=Math.max(1,s.W-boxW(w)),ah=Math.max(1,s.H-TOP-boxH(w)-8);
  return {fx:Math.min(1,Math.max(0,x/aw)),fy:Math.min(1,Math.max(0,(y-TOP)/ah))}}
function fromFrac(w,p){var s=deskSize();var aw=Math.max(0,s.W-boxW(w)),ah=Math.max(0,s.H-TOP-boxH(w)-8);
  return {x:p.fx*aw,y:TOP+p.fy*ah}}
function setPos(id,x,y){var n=nodes[id];if(!n)return;n.x=x;n.y=y;n.el.style.transform="translate("+Math.round(x)+"px,"+Math.round(y)+"px)"}
function layoutAll(){DATA.works.forEach(function(w){var p=fromFrac(w,place[w.id]||{fx:.5,fy:.5});setPos(w.id,p.x,p.y)})}
function initPlaces(){
  narrow=desk.clientWidth<720;
  if(narrow){gridPlace()}else DATA.works.forEach(function(w){place[w.id]={fx:w.x==null?Math.random()*.9:w.x,fy:w.y==null?Math.random()*.8:w.y}})}

function renderDesk(){
  iconsLayer.textContent="";nodes={};
  if(!DATA.works.length){iconsLayer.appendChild(h("div",{class:"desk-empty",text:"작업이 곧 올라옵니다."}));return}
  DATA.works.forEach(function(w){
    var s=Math.round(BASE*(w.scale||1));
    var el=h("button",{class:"icon",style:"--s:"+s+"px","aria-label":w.title+(w.year?", "+w.year:"")+" 열기"},
      h("span",{class:"pic"},h("img",{src:imgSrc(w.icon),alt:"",draggable:"false"})),
      h("span",{class:"lab",text:w.title||"제목 없음"}));
    nodes[w.id]={el:el,x:0,y:0,vx:0,vy:0,w:w};
    attachDrag(el,w);
    el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openWork(w.id)}});
    iconsLayer.appendChild(el)});
  layoutAll()}

function select(id){if(selected&&nodes[selected])nodes[selected].el.classList.remove("sel");selected=id;if(id&&nodes[id])nodes[id].el.classList.add("sel")}
desk.addEventListener("pointerdown",function(e){if(e.target===desk||e.target===iconsLayer)select(null)});

var anim=null;
function attachDrag(el,w){
  var sx,sy,ox,oy,moved,lastT,lx,ly,vx,vy,pid=null;
  el.addEventListener("pointerdown",function(e){
    if(e.button!==0)return;pid=e.pointerId;el.setPointerCapture(pid);
    var n=nodes[w.id];n.vx=n.vy=0;sx=e.clientX;sy=e.clientY;ox=n.x;oy=n.y;moved=false;lastT=performance.now();lx=sx;ly=sy;vx=vy=0;
    el.style.zIndex=++zTop;select(w.id)});
  el.addEventListener("pointermove",function(e){
    if(e.pointerId!==pid)return;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<5)return;
    if(!moved){moved=true;el.classList.add("dragging")}
    var s=deskSize();var x=Math.min(Math.max(ox+dx,-boxW(w)*.3),s.W-boxW(w)*.7),y=Math.min(Math.max(oy+dy,TOP-6),s.H-boxH(w)*.6);
    setPos(w.id,x,y);
    var t=performance.now(),dt=Math.max(8,t-lastT);vx=vx*.6+(e.clientX-lx)/dt*16*.4;vy=vy*.6+(e.clientY-ly)/dt*16*.4;lastT=t;lx=e.clientX;ly=e.clientY});
  function end(e){
    if(e.pointerId!==pid)return;pid=null;el.classList.remove("dragging");
    if(!moved){openWork(w.id);return}
    var n=nodes[w.id];
    if(!reduce&&performance.now()-lastT<80&&Math.hypot(vx,vy)>1.5){n.vx=vx;n.vy=vy;startAnim()}else settle(w)}
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("click",function(e){if(e.detail===0)return;e.preventDefault()})}
function settle(w){var n=nodes[w.id];if(!n)return;var s=deskSize();
  var x=Math.min(Math.max(n.x,0),s.W-boxW(w)),y=Math.min(Math.max(n.y,TOP),s.H-boxH(w)-8);setPos(w.id,x,y);
  place[w.id]=toFrac(w,x,y);
  if(canEdit&&!narrow){w.x=+place[w.id].fx.toFixed(4);w.y=+place[w.id].fy.toFixed(4);markDirty("배치")}}
function startAnim(){if(anim)return;
  var step=function(){var any=false,s=deskSize();
    Object.keys(nodes).forEach(function(id){var n=nodes[id];if(!n.vx&&!n.vy)return;
      var x=n.x+n.vx,y=n.y+n.vy,maxX=s.W-boxW(n.w),maxY=s.H-boxH(n.w)-8;
      if(x<0){x=0;n.vx=-n.vx*.45}if(x>maxX){x=maxX;n.vx=-n.vx*.45}
      if(y<TOP){y=TOP;n.vy=-n.vy*.45}if(y>maxY){y=maxY;n.vy=-n.vy*.45}
      n.vx*=.9;n.vy*=.9;setPos(id,x,y);
      if(Math.abs(n.vx)<.15&&Math.abs(n.vy)<.15){n.vx=n.vy=0;settle(n.w)}else any=true});
    anim=any?requestAnimationFrame(step):null};
  anim=requestAnimationFrame(step)}
var rT;window.addEventListener("resize",function(){clearTimeout(rT);rT=setTimeout(function(){var was=narrow;narrow=desk.clientWidth<720;if(was!==narrow)initPlaces();layoutAll()},80)});

/* ---------- windows ---------- */
var wins={}, cascade=0;
function focusWin(win){Object.keys(wins).forEach(function(k){wins[k].classList.remove("front")});win.classList.add("front");win.style.zIndex=200+(++zTop)}
function closeWin(key){var w=wins[key];if(!w)return;w.remove();delete wins[key];
  if(location.hash.slice(1)===key)history.replaceState(null,"",location.pathname+location.search);
  var keys=Object.keys(wins);if(keys.length)focusWin(wins[keys[keys.length-1]])}
function openWindow(key,title,body,o){
  o=o||{};
  if(wins[key]){focusWin(wins[key]);if(o.refresh){var b=wins[key].querySelector(".win-body");b.textContent="";b.appendChild(body);wins[key].querySelector(".win-title").textContent=title}return wins[key]}
  var s=deskSize(),W=Math.min(o.w||640,s.W-16),H=Math.min(o.h||520,s.H-TOP-16);
  var x=Math.max(8,(s.W-W)/2+(cascade%5)*26-52),y=Math.max(TOP+6,(s.H-H)/2+(cascade%5)*22-30);cascade++;
  var titleEl=h("div",{class:"win-title",text:title});
  var bar=h("div",{class:"win-bar"},
    h("div",{class:"lights"},
      h("button",{class:"light close","aria-label":"닫기",onclick:function(e){e.stopPropagation();closeWin(key)}}),
      h("button",{class:"light min","aria-label":"닫기",tabindex:"-1",onclick:function(e){e.stopPropagation();closeWin(key)}}),
      h("button",{class:"light max","aria-label":"크게 보기",tabindex:"-1",onclick:function(e){e.stopPropagation();var ss=deskSize();win.style.left="8px";win.style.top=(TOP+4)+"px";win.style.width=(ss.W-16)+"px";win.style.height=(ss.H-TOP-12)+"px"}})),
    titleEl);
  var bodyEl=h("div",{class:"win-body"},body);
  var win=h("section",{class:"win",role:"dialog","aria-label":title,style:"left:"+x+"px;top:"+y+"px;width:"+W+"px;height:"+H+"px"},bar,bodyEl);
  win.addEventListener("pointerdown",function(){focusWin(win)},true);
  var dx,dy,pid=null;
  bar.addEventListener("pointerdown",function(e){if(e.target.closest(".light")||desk.clientWidth<720)return;pid=e.pointerId;bar.setPointerCapture(pid);dx=e.clientX-win.offsetLeft;dy=e.clientY-win.offsetTop});
  bar.addEventListener("pointermove",function(e){if(e.pointerId!==pid)return;var ss=deskSize();
    win.style.left=Math.min(Math.max(e.clientX-dx,-win.offsetWidth+120),ss.W-120)+"px";win.style.top=Math.min(Math.max(e.clientY-dy,TOP),ss.H-40)+"px"});
  bar.addEventListener("pointerup",function(){pid=null});
  desk.appendChild(win);wins[key]=win;focusWin(win);
  if(o.hash)history.replaceState(null,"","#"+key);
  setTimeout(function(){var f=win.querySelector(".light.close");if(f)f.focus({preventScroll:true})},0);
  return win}
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  var top=null,z=-1;Object.keys(wins).forEach(function(k){var zz=+wins[k].style.zIndex;if(zz>z){z=zz;top=k}});if(top)closeWin(top)});

/* ---------- work window ---------- */
function openWork(id){
  var w=DATA.works.find(function(x){return x.id===id});if(!w)return;
  var pics=(w.images&&w.images.length?w.images.slice():[]);var cutIdx=-1;
  if(w.icon){pics.push(w.icon);cutIdx=pics.length-1}
  var mainImg=h("img",{alt:w.title});
  var thumbs=h("div",{class:"thumbs"});
  function show(i){mainImg.src=imgSrc(pics[i]);mainImg.className=(i===cutIdx)?"cut":"";
    Array.prototype.forEach.call(thumbs.children,function(t,j){t.setAttribute("aria-current",j===i?"true":"false")})}
  if(pics.length>1)pics.forEach(function(p,i){thumbs.appendChild(h("button",{class:"thumb","aria-label":(i+1)+"번째 이미지",style:"background-image:url(\""+imgSrc(p)+"\")",onclick:function(){show(i)}}))});
  var meta=h("dl",{class:"meta"});
  [["연도",w.year,0],["재료",w.medium,1],["크기",w.size,0]].forEach(function(r){if(r[1]){meta.appendChild(h("dt",{text:r[0]}));meta.appendChild(h("dd",{class:r[2]?"txt":null,text:r[1]}))}});
  var body=h("div",{class:"work"},
    h("div",{class:"work-stage"},h("div",{class:"work-main"},mainImg),pics.length>1?thumbs:null),
    h("div",{class:"work-info"},
      h("h2",null,w.title||"제목 없음",w.sample?h("span",{class:"tag",text:"예시"}):null),
      meta,
      h("div",{class:"prose"},paras(w.desc))));
  show(0);
  openWindow("w-"+id,w.title||"작업",body,{w:880,h:600,refresh:true})}

/* ---------- list / cv / statement / info ---------- */
function openList(){
  var tb=h("tbody");
  DATA.works.forEach(function(w){tb.appendChild(h("tr",{class:"rowbtn",tabindex:"0",onclick:function(){openWork(w.id)},onkeydown:function(e){if(e.key==="Enter")openWork(w.id)}},
    h("td",null,h("img",{class:"mini",src:imgSrc(w.icon),alt:""})),h("td",{text:w.title||"제목 없음"}),h("td",{class:"num",text:w.year||""}),h("td",{text:w.medium||""})))});
  var body=h("div",{style:"overflow-x:auto"},h("table",{class:"list"},h("thead",null,h("tr",null,h("th",{style:"width:40px"}),h("th",{text:"제목"}),h("th",{text:"연도"}),h("th",{text:"재료"}))),tb));
  openWindow("works","작업 목록 — "+DATA.works.length+"점",body,{w:620,h:440,refresh:true})}
function openCV(){
  var doc=h("div",{class:"doc"},h("div",{class:"doc-head"},h("h2",{text:DATA.site.name||""}),DATA.site.nameEn?h("p",{text:DATA.site.nameEn}):null));
  DATA.cv.forEach(function(sec){if(!sec.items||!sec.items.length)return;
    doc.appendChild(h("section",{class:"cv-sec"},h("h3",{text:sec.cat}),sec.items.map(function(it){return h("div",{class:"cv-row"},h("span",{class:"y",text:it.year||""}),h("span",{text:it.text||""}))})))});
  openWindow("cv","작가 이력",doc,{w:600,h:560,hash:true,refresh:true})}
function openStatement(){
  var lang=DATA.statement.ko?"ko":"en";
  var txt=h("div",{class:"prose"});
  var hasBoth=DATA.statement.ko&&DATA.statement.en;
  var bK=h("button",{"aria-pressed":"true",onclick:function(){set("ko")}},"한국어"),bE=h("button",{"aria-pressed":"false",onclick:function(){set("en")}},"English");
  function set(l){lang=l;bK.setAttribute("aria-pressed",l==="ko");bE.setAttribute("aria-pressed",l==="en");txt.textContent="";paras(DATA.statement[l]).forEach(function(p){txt.appendChild(p)});txt.lang=l}
  var doc=h("div",{class:"doc"},h("div",{class:"doc-head",style:"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"},
    h("h2",{text:"작가 노트"}),hasBoth?h("div",{class:"seg"},bK,bE):null),txt);
  set(lang);
  openWindow("statement","스테이트먼트",doc,{w:620,h:580,hash:true,refresh:true})}
function openInfo(){
  var dl=h("dl",{class:"meta"});
  if(DATA.site.email){dl.appendChild(h("dt",{text:"이메일"}));dl.appendChild(h("dd",null,h("span",{style:"user-select:all",text:DATA.site.email})))}
  if(DATA.site.instagram){var ig=DATA.site.instagram.replace(/^@/,"");dl.appendChild(h("dt",{text:"인스타그램"}));dl.appendChild(h("dd",null,h("a",{href:"https://instagram.com/"+encodeURIComponent(ig),target:"_blank",rel:"noopener",text:"@"+ig})))}
  var doc=h("div",{class:"doc"},h("div",{class:"doc-head"},h("h2",{text:DATA.site.name||""}),DATA.site.nameEn?h("p",{text:DATA.site.nameEn}):null),dl,
    h("div",{class:"row-acts"},h("button",{class:"btn",onclick:function(){openCV()}},"이력 보기"),h("button",{class:"btn",onclick:function(){openStatement()}},"스테이트먼트 읽기")));
  openWindow("info","정보",doc,{w:420,h:320,refresh:true})}

function markDirty(){}
/* ---------- boot ---------- */
fetch("content/site.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DATA=normalize(d)}).catch(function(){DATA=normalize({})}).then(function(){
  applyBg();renderName();if(DATA.site.name)document.title=DATA.site.name+(DATA.site.nameEn?" — "+DATA.site.nameEn:"");
  requestAnimationFrame(function(){initPlaces();renderDesk();
    var hs=location.hash.slice(1);if(hs==="cv")openCV();else if(hs==="statement")openStatement()})});
})();
</script>
